services:
  app:
    image: ${NETWAKE_IMAGE:-azheng95/netwake:1.0.1}
    container_name: netwake
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    network_mode: host
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    environment:
      DB_PATH: /data/netwake.db
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env}
      ALLOW_INITIAL_TOKEN_ENDPOINT: ${ALLOW_INITIAL_TOKEN_ENDPOINT:-false}
      APP_PORT: ${APP_PORT:-18080}
      # Keep the host-networked app on private backend ports. netwake-link
      # publishes the user-facing ports while LAN scanning stays unchanged.
      WEB_HTTP_PORT: ${BACKEND_HTTP_PORT:-18081}
      WEB_HTTPS_PORT: ${BACKEND_HTTPS_PORT:-18082}
      TLS_HOST: ${TLS_HOST:?Set TLS_HOST in .env}
      AGENT_NAME: ${AGENT_NAME:-netwake-agent}
      SCAN_INTERFACE: ${SCAN_INTERFACE:-}
      DEFAULT_CIDR: ${DEFAULT_CIDR:-192.168.0.0/24}
    volumes:
      - ./data:/data
      - caddy_data:/tls
      - caddy_config:/config

  link:
    image: nginx:1.27-alpine
    container_name: netwake-link
    restart: unless-stopped
    init: true
    ports:
      - "${PUBLIC_HTTP_PORT:-26665}:26665"
      - "${PUBLIC_HTTPS_PORT:-26666}:26666"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxy-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  caddy_data:
    name: lanwake-hub_caddy_data
  caddy_config:
    name: lanwake-hub_caddy_config
